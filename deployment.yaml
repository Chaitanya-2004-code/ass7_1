apiVersion: apps/v1
kind: Deployment
metadata:
  name: ass7-1-deployment
  labels:
    app: ass7-1

spec:
  replicas: 1
  selector:
    matchLabels:
      app: ass7-1
  template:
    metadata:
      labels:
        app: ass7-1
    spec:
      containers:
      - name: ass7-1
        image: chai2004/ass7_1:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        

