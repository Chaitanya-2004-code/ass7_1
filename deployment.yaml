apiVersion: apps/v1
kind: Deployment
metadata:
  name: ass7_1_deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ass7_1
  template:
    metadata:
      labels:
        app: ass7_1
    spec:
      containers:
      - name: ass7_1
        image: chai2004/ass7_1:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        

